# Generated from nix/workflows.nix (actions/status/action.yml): edit there, then `nix run .#snapshots -- workflows`.
name: status
description: Write the result of every cell of this run to gh-pages as shields.io endpoint JSON (status/<system>/<check>.json). The README matrix and the site index read those files. With `pending`, before the build, write a grey placeholder for each listed check that has no file yet.
inputs:
  jobs:
    description: JSON array of cells that are plain jobs of the run, not matrix entries (miri).
    default: "[]"
    required: false
  build:
    description: JSON array of checks the plan sent to the matrix.
    default: "[]"
    required: false
  cached:
    description: JSON array of checks the plan skipped as cache hits (recorded as pass).
    default: "[]"
    required: false
  pending:
    description: JSON array of checks about to build. When set, only placeholders are written, for the ones without a file, and no results.
    default: ""
    required: false
  plan:
    description: Result of the plan job; anything but success fails the run.
    default: success
    required: false
  system:
    description: Nix system of the matrix this run built (x86_64-linux, aarch64-linux).
    required: true
runs:
  steps:
  - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    with:
      path: site
      persist-credentials: false
      ref: gh-pages
  - env:
      BUILD: ${{ inputs.build }}
      CACHED: ${{ inputs.cached }}
      GH_TOKEN: ${{ github.token }}
      JOBS: ${{ inputs.jobs }}
      PENDING: ${{ inputs.pending }}
      PLAN: ${{ inputs.plan }}
      SYSTEM: ${{ inputs.system }}
    shell: bash
    run: |
      if [ -n "$PENDING" ]; then
        printf '%s' "$PENDING" > pending.json
        .github/status.sh --pending "$SYSTEM" pending.json site/status
        echo "what=pending" >> "$GITHUB_ENV"
      else
        gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > jobs.json
        # A failed plan leaves its outputs empty, not `[]`.
        jq -n --arg plan "$PLAN" --argjson build "${BUILD:-[]}" \
          --argjson cached "${CACHED:-[]}" --argjson jobs "$JOBS" \
          '{$plan, $build, $cached, $jobs}' > cells.json
        .github/status.sh "$SYSTEM" jobs.json site/status cells.json
        echo "what=status" >> "$GITHUB_ENV"
      fi
  - env:
      GH_TOKEN: ${{ github.token }}
      SYSTEM: ${{ inputs.system }}
    shell: bash
    working-directory: site
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add status
      git commit -qm "$what: $SYSTEM ${GITHUB_SHA::8}" || exit 0
      # gh-pages is shared with the other CI workflow and with pages.yml:
      # rebase on a lost race and retry. The checkout kept no token.
      remote="https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY"
      for _ in 1 2 3 4 5; do
        git push "$remote" HEAD:gh-pages && exit 0
        git pull --rebase -q "$remote" gh-pages
      done
      exit 1
  using: composite
