# Generated from nix/workflows.nix (workflows/bench.yml): edit there, then `nix run .#snapshots -- workflows`.
# By hand: one bench on x86_64, Neoverse (the aarch64 runner) and Apple
# silicon, for numbers a PR elsewhere needs from machines this one is
# not. Default target features, as a distribution builds; the bencher
# lines go up as one artifact a runner. Nothing is tracked or compared:
# pages.yml keeps the trend.
name: bench
"on":
  workflow_dispatch:
    inputs:
      bench:
        description: cargo bench --bench <name>
        default: filter
        required: true
        type: string
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  bench:
    name: ${{ matrix.runner }}
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-latest
        - ubuntu-24.04-arm
        - macos-15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
    - env:
        BENCH: ${{ inputs.bench }}
      run: cargo bench --bench "$BENCH" -- --output-format bencher | tee bench.txt
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ format('bench-{0}-{1}', inputs.bench, matrix.runner) }}
        path: bench.txt
