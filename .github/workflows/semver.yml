name: semver
on:
  push:
    branches: [main]
  pull_request:

# The last release against this tree: cargo-semver-checks says whether
# the version in Cargo.toml went up enough for what changed. Outside the
# nix matrix: it needs the registry for the baseline, and it is not in the
# binary cache, so a nix check would build it from source every week.
# The action downloads it built. `public-api.txt` (a nix check) sees every
# change; this one says which of them break.
jobs:
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: obi1kenobi/cargo-semver-checks-action@v2.9
