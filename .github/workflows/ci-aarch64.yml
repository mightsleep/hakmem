name: aarch64
on:
  push:
    branches: [main]
  pull_request:

# The matrix lives in the flake: `plan` reads the check names, `check` expands them.
jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - id: plan
        run: echo "checks=$(nix eval --json .#checks.aarch64-linux --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  check:
    needs: plan
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.plan.outputs.checks) }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: cachix/cachix-action@v17
        with:
          name: hakmem
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build -L .#checks.aarch64-linux.${{ matrix.check }}

  # Result of every cell to gh-pages for the README matrix and the site.
  # Pushes to main only: a PR run must not overwrite the status of main.
  status:
    needs: [plan, check]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/status
        with:
          system: aarch64-linux
