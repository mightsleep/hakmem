# Generated from nix/workflows.nix (workflows/ci-x86_64.yml): edit there, then `nix run .#snapshots -- workflows`.
# The matrix lives in the flake: `plan` reads the check names and asks the
# binary cache which outputs already exist, `check` builds only the rest
# (.github/plan.sh). A cell whose output is in the cache passed by
# construction; `status` records it as such.
name: x86_64
"on":
  pull_request: {}
  push:
    branches:
    - main
permissions: {}
defaults:
  run:
    shell: bash
jobs:
  plan:
    permissions:
      contents: read
    outputs:
      cached: ${{ steps.plan.outputs.cached }}
      checks: ${{ steps.plan.outputs.checks }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      with:
        extra-conf: extra-experimental-features = pipe-operators
    - id: plan
      run: .github/plan.sh x86_64-linux
  # GitHub rejects an empty matrix; nothing to build is a valid plan.
  check:
    name: ${{ matrix.check }}
    permissions:
      contents: read
    needs: plan
    if: needs.plan.outputs.checks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.plan.outputs.checks) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      with:
        extra-conf: extra-experimental-features = pipe-operators
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: hakmem
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - env:
        CHECK: ${{ matrix.check }}
      run: nix build -L ".#checks.x86_64-linux.$CHECK"
  miri:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      with:
        extra-conf: extra-experimental-features = pipe-operators
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: hakmem
        authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
    - run: nix run .#miri-hakmem
  # A grey placeholder for every cell about to build that has no badge
  # yet: a missing file is a red "resource not found" in the README, and a
  # check new in this push has none until the run ends.
  pending:
    permissions:
      contents: write
    needs: plan
    if: github.event_name == 'push' && needs.plan.outputs.checks != '[]'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/status
      with:
        pending: ${{ needs.plan.outputs.checks }}
        system: x86_64-linux
  # Result of every cell to gh-pages for the README matrix and the site.
  # Pushes to main only: a PR run must not overwrite the status of main.
  status:
    permissions:
      actions: read
      contents: write
    needs:
    - plan
    - pending
    - check
    - miri
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: ./.github/actions/status
      with:
        cached: ${{ needs.plan.outputs.cached }}
        system: x86_64-linux
